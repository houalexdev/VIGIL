# =============================================================================
# 预置规则与分组场景
# -----------------------------------------------------------------------------
# 依据工业设备预测性维护（PHM）典型失效模式整理，覆盖旋转机械 / 振动 /
# 液压 / 热管理 / 电气与 PLC 五个子系统。
#
# 启动时由 app/presets.py 读取本文件写入数据库：
#   - 场景 ID 已存在则整体跳过，不覆盖用户在界面上的改动；
#   - 规则 ID 已存在则按 ID 更新（force=True 时才重建）。
# 想加预置：直接在下面追加一条，或在「规则中心」界面上建好后导出回来。
#
# 规则字段：
#   id        规则 ID（唯一，建议 R-<场景>-NN）
#   code      测点代号（须在 telemetry.yaml 中或符合命名规则）
#   name      规则名
#   judge     判据描述（人读）
#   note      设计说明（写进规则备注，界面上会显示）
#   algorithms
#     - algo_id   算法编号（algorithm/ 下已注册的）
#       params    算法参数，必须与 ParamSpec 对齐，参数名不得臆造
#       note      为什么这样配
#   元数据（code_name/unit/kind/low/high/bit_width/quantum）默认从
#   telemetry.yaml 取；只有需要覆盖时才在规则里显式写。
# =============================================================================

scenes:
  - id: S-SPIN
    name: 旋转机械
    desc: >-
      旋转机械与振动场景：主轴/电机/轴承温度越界与温升速率、温度跳变与冻结、
      振动噪声膨胀、振动-电流相关劣化、前后振动成对偏置、运行模式驻留超时、
      累计运行小时停摆、转速数据缺口。涵盖机械磨损、润滑失效、不对中与传感器故障。
    source: preset
    rules: [R-SPN-01, R-SPN-02, R-SPN-03, R-SPN-04, R-SPN-05,
            R-SPN-06, R-SPN-07, R-SPN-08, R-SPN-09, R-SPN-10, R-SPN-11]

  - id: S-ELEC
    name: 电气与PLC
    desc: >-
      电气与液压/热管理场景：母线电压越界、相电流越界与跳变、三相电流成对偏置、
      变频器非法状态、故障计数非零、诊断标志位、PLC 状态字信号丢失、安全联锁断开、
      油温高且冷却泵未开的复合判据、液压压力骤降。涵盖驱动故障、安全联锁与换热失效。
    source: preset
    rules: [R-ELC-01, R-ELC-02, R-ELC-03, R-ELC-04, R-ELC-05,
            R-ELC-06, R-ELC-07, R-ELC-08, R-ELC-09, R-ELC-10, R-ELC-11]

rules:
  # ---------------------------------------------------------------------------
  # 01 主轴前轴承温度越界 —— 最基础的阈值判据
  # ---------------------------------------------------------------------------
  - id: R-SPN-01
    code: SPN1001
    name: 主轴前轴承温度越界
    judge: V < 5 或 V > 100 ℃，连续 3 拍
    note: 轴承温度跑出允许区间，连续 k 拍成立才报
    algorithms:
      - algo_id: A-01
        params: {mode: outside, low: 5.0, high: 100.0, k: 3, level: 严重}
        note: 越限 + 连续 3 拍去抖

  # ---------------------------------------------------------------------------
  # 02 电机绕组温度越界 —— F 级绝缘上限
  # ---------------------------------------------------------------------------
  - id: R-SPN-02
    code: SPN1002
    name: 电机绕组温度越界
    judge: V > 145 ℃，连续 3 拍
    note: 绕组长期 ≤130 ℃，145 ℃ 以上属危险区
    algorithms:
      - algo_id: A-01
        params: {mode: outside, low: -10.0, high: 145.0, k: 3, level: 严重}
        note: 绝缘等级上限 + 去抖

  # ---------------------------------------------------------------------------
  # 03 绕组温升速率超限 —— Theil-Sen 斜率
  # ---------------------------------------------------------------------------
  - id: R-SPN-03
    code: SPN1002
    name: 绕组温升速率超限
    judge: 11 拍窗口内升温速率 > 0.8 ℃/s
    note: 温升速率比绝对温度更早暴露匝间短路与过载
    algorithms:
      - algo_id: A-05
        params: {window: 11, max_rate: 0.8, direction: up, k: 3, max_gap_s: 600, level: 严重}
        note: 只判升温方向，连续 3 拍确认

  # ---------------------------------------------------------------------------
  # 04 后轴承温度单拍跳变 —— MAD 稳健门限
  # ---------------------------------------------------------------------------
  - id: R-SPN-04
    code: SPN1003
    name: 后轴承温度单拍跳变
    judge: 单拍变化量 > max(1.5 ℃, 3.5σ, 3 LSB)
    note: 两段式确认回落，区分传感器野值与真实台阶
    algorithms:
      - algo_id: A-03
        params: {window: 31, z: 3.5, a_abs: 1.5, lsb_floor: 3.0,
                 two_stage: true, level: 严重}
        note: MAD 稳健门限 + 绝对地板

  # ---------------------------------------------------------------------------
  # 05 后轴承温度死值冻结 —— 极差严格为 0
  # ---------------------------------------------------------------------------
  - id: R-SPN-05
    code: SPN1003
    name: 后轴承温度死值冻结
    judge: 连续 64 拍取值完全相同（极差 = 0）
    note: 传感器/采集通道掉线典型症状
    algorithms:
      - algo_id: A-02
        params: {n_dead: 64, tolerance: 0.0, ignore_zero: false, level: 严重}
        note: 极差严格为 0，容忍 2 LSB 会漏判

  # ---------------------------------------------------------------------------
  # 06 振动噪声膨胀 —— 齿面剥落早期征兆
  # ---------------------------------------------------------------------------
  - id: R-SPN-06
    code: VIB3004
    name: 齿轮箱振动噪声膨胀
    judge: 60 拍窗口 σ 超过基线 σ 的 3 倍
    note: 振动 RMS 的噪声水平突增常先于谱峰异常
    algorithms:
      - algo_id: A-04
        params: {window: 60, ratio_up: 3.0, ratio_down: 0.2,
                 detect_collapse: true, hold_points: 3, level: 一般}
        note: 在线估计基线 σ，膨胀 3 倍即报

  # ---------------------------------------------------------------------------
  # 07 振动-电流相关性劣化 —— 滑窗皮尔逊
  # ---------------------------------------------------------------------------
  - id: R-SPN-07
    code: VIB3002
    name: 振动与电流相关性劣化
    judge: 30 min 滑窗内 |r(VIB3002, SPN2002)| < 0.6
    note: 正常工况下振动与电流强相关，劣化说明机械传动异常
    algorithms:
      - algo_id: A-07
        params: {peer_code: SPN2002, window_s: 1800.0, mode: absolute,
                 r_threshold: 0.6, k: 5, level: 严重}
        note: 绝对相关阈值，连续 5 拍确认

  # ---------------------------------------------------------------------------
  # 08 前后振动成对偏置 —— 区分单侧轴承与整体不对中
  # ---------------------------------------------------------------------------
  - id: R-SPN-08
    code: VIB3003
    name: 前后振动成对偏置
    judge: 与 VIB3001 的偏差连续超 3 MAD 且 CUSUM 分离 > 0.3
    note: 单侧抬升判轴承，双侧同时抬升判不对中/基础松动
    algorithms:
      - algo_id: A-09
        params: {peer_code: VIB3001, pair_mode: cross_check, bias_mode: auto,
                 dev_abs: 0.5, dev_k: 3.0, cusum_window_s: 60.0,
                 cusum_thr: 0.3, sign_check: false, k: 5, level: 严重}
        note: 自动扣偏置 + CUSUM 累计分离

  # ---------------------------------------------------------------------------
  # 09 运行模式驻留超时 —— 加减速态停留过久
  # ---------------------------------------------------------------------------
  - id: R-SPN-09
    code: SPN7001
    name: 加减速模式驻留超时
    judge: 模式=3（加减速）持续超过 300 s
    note: 长期卡在加减速态说明驱动器或负载异常
    algorithms:
      - algo_id: A-24
        params: {target_values: [3], max_dwell_s: 300.0, mode: too_long,
                 k: 1, level: 一般}
        note: 状态值合法但时长超限，越限判据无法表达

  # ---------------------------------------------------------------------------
  # 10 累计运行小时停摆 —— 计数器不增
  # ---------------------------------------------------------------------------
  - id: R-SPN-10
    code: SPN8001
    name: 累计运行小时停摆
    judge: 16 bit 计数在设备运行时不再增加
    note: 计数器停摆多为采集链路故障
    algorithms:
      - algo_id: A-10
        params: {bits: 16, mode: no_increase, k: 2, level: 严重}
        note: 模回绕计数差分，连续 2 拍不增即报

  # ---------------------------------------------------------------------------
  # 11 转速数据缺口 —— 全测点兜底
  # ---------------------------------------------------------------------------
  - id: R-SPN-11
    code: SPN2001
    name: 转速数据缺口
    judge: 两拍间隔超过 2.5 倍包周期，或窗内缺失率 > 5%
    note: 无数据时所有判据静默返回正常，缺口本身必须告警
    algorithms:
      - algo_id: A-27
        params: {gap_k: 2.5, min_gap_points: 2, max_loss_ratio: 0.05,
                 level: 一般}
        note: 缺口 + 缺失率双重判定

  # ===========================================================================
  # 电气与 PLC
  # ===========================================================================
  # ---------------------------------------------------------------------------
  # 01 直流母线电压越界
  # ---------------------------------------------------------------------------
  - id: R-ELC-01
    code: ELC6001
    name: 直流母线电压越界
    judge: V < 480 或 V > 600 V，连续 3 拍
    note: 380 V 三相整流约 537 V，欠压/过压均属故障
    algorithms:
      - algo_id: A-01
        params: {mode: outside, low: 480.0, high: 600.0, k: 3, level: 严重}
        note: 母线电压允许带 + 去抖

  # ---------------------------------------------------------------------------
  # 02 A 相电流越界
  # ---------------------------------------------------------------------------
  - id: R-ELC-02
    code: ELC6002
    name: A 相电流越界
    judge: V > 50 A，连续 3 拍
    note: 额定 40 A，50 A 以上为过载区
    algorithms:
      - algo_id: A-01
        params: {mode: outside, low: 0.0, high: 50.0, k: 3, level: 严重}
        note: 过流 + 去抖

  # ---------------------------------------------------------------------------
  # 03 B 相电流单拍跳变
  # ---------------------------------------------------------------------------
  - id: R-ELC-03
    code: ELC6003
    name: B 相电流单拍跳变
    judge: 单拍变化量 > max(2 A, 3.5σ, 3 LSB)
    note: 电流突跳多为接触器抖动或负载突变
    algorithms:
      - algo_id: A-03
        params: {window: 31, z: 3.5, a_abs: 2.0, lsb_floor: 3.0,
                 two_stage: true, level: 严重}
        note: MAD 稳健门限 + 绝对地板

  # ---------------------------------------------------------------------------
  # 04 三相电流成对偏置 —— 不平衡
  # ---------------------------------------------------------------------------
  - id: R-ELC-04
    code: ELC6002
    name: AB 相电流不平衡
    judge: 与 ELC6003 的偏差连续超 3 MAD 且 CUSUM 分离 > 0.5 A
    note: 三相不平衡会导致电机额外发热与转矩脉动
    algorithms:
      - algo_id: A-09
        params: {peer_code: ELC6003, pair_mode: cross_check, bias_mode: auto,
                 dev_abs: 1.0, dev_k: 3.0, cusum_window_s: 60.0,
                 cusum_thr: 0.5, sign_check: false, k: 5, level: 严重}
        note: 自动扣偏置 + CUSUM 累计分离

  # ---------------------------------------------------------------------------
  # 05 变频器非法状态 —— 故障态单拍即报
  # ---------------------------------------------------------------------------
  - id: R-ELC-05
    code: ELC7001
    name: 变频器进入故障态
    judge: 状态=2（故障）单拍即报
    note: 合法值 0/1/3；2 为已知故障特征码
    algorithms:
      - algo_id: A-23
        params: {legal_values: [0, 1, 3], strict: true,
                 bad_values: {2: 严重}, k: 1, level: 严重}
        note: 枚举合法性 + 故障特征码分级

  # ---------------------------------------------------------------------------
  # 06 变频器故障计数非零 —— 恒零量单拍即报
  # ---------------------------------------------------------------------------
  - id: R-ELC-06
    code: ELC8001
    name: 变频器故障计数非零
    judge: V ≠ 0 单拍即报
    note: 该计数设计恒为 0，任何非零都是真实故障
    algorithms:
      - algo_id: A-01
        params: {mode: outside, low: 0.0, high: 0.0, k: 1, level: 严重}
        note: 定值判据，上下界同为 0 等价于 ≠0

  # ---------------------------------------------------------------------------
  # 07 变频器诊断标志位 —— 逐位展开
  # ---------------------------------------------------------------------------
  - id: R-ELC-07
    code: ELC9002
    name: 变频器诊断标志异常
    judge: 16 位诊断字中任意位为 1
    note: 期望值 0，极性 1=故障；逐位定位到 bit:N
    algorithms:
      - algo_id: A-11
        params: {bit_offset: 0, bit_width: 16, mode: any_set, fault_value: 1,
                 expand_bits: true, k: 2, level: 严重}
        note: 逐位展开输出，定位具体故障位

  # ---------------------------------------------------------------------------
  # 08 PLC 输入状态字信号丢失 —— 整字段等于判定
  # ---------------------------------------------------------------------------
  - id: R-ELC-08
    code: ELC9001
    name: PLC 输入信号丢失
    judge: 16 位状态字 ≠ 65535（期望全正常）
    note: 极性 0=信号丢失；整字段比较而非逐位
    algorithms:
      - algo_id: A-11
        params: {bit_offset: 0, bit_width: 16, mode: equals, expect_value: 65535,
                 expand_bits: false, k: 2, level: 严重}
        note: equals 模式，整字段不等于期望值即报

  # ---------------------------------------------------------------------------
  # 09 安全联锁断开 —— 致命级
  # ---------------------------------------------------------------------------
  - id: R-ELC-09
    code: ELC0002
    name: 安全联锁断开
    judge: 联锁状态 ≠ 1，单拍即报
    note: 联锁闭合是设备运行的先决条件
    algorithms:
      - algo_id: A-23
        params: {legal_values: [1], strict: true, k: 1, level: 致命}
        note: 布尔量按枚举合法性判定

  # ---------------------------------------------------------------------------
  # 10 油温高且冷却泵未开 —— 复合判据
  # ---------------------------------------------------------------------------
  - id: R-ELC-10
    code: TRM5001
    name: 油温高且冷却泵未开
    judge: TRM5001 ≥ 60 ℃ 且 TRM0001 = 0，连续 3 拍
    note: 应开未开类复合判据，单看任一路都正常
    algorithms:
      - algo_id: A-25
        params:
          conditions:
            - {id: C1, code: TRM5001, op: ge, value: 60.0}
            - {id: C2, code: TRM0001, op: eq, value: 0}
          logic: C1 and C2
          k: 3
          level: 严重
        note: k-of-n 之外的 AND 组合，跨测点对齐

  # ---------------------------------------------------------------------------
  # 11 液压压力骤降 —— 泄漏/泵失效
  # ---------------------------------------------------------------------------
  - id: R-ELC-11
    code: HYG4001
    name: 液压压力骤降
    judge: 单拍下降 > max(1 MPa, 3.5σ, 3 LSB)
    note: 压力骤降多为管路泄漏或泵失效
    algorithms:
      - algo_id: A-03
        params: {window: 31, z: 3.5, a_abs: 1.0, lsb_floor: 3.0,
                 two_stage: true, level: 严重}
        note: 两段式确认，区分瞬态跌落与持续泄漏

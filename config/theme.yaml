# =============================================================================
# 视觉主题（深色科技风：深蓝底 + 青蓝荧光 + 细网格 + 角标）
# -----------------------------------------------------------------------------
# 改配色只改下面 variables 里的值即可，CSS 里的 ${...} 会自动代入。
# levels 相关的色标由 config/app.yaml → levels 生成，不在这里手写。
#
# 模板变量：
#   ${root_vars}   :root 变量块（由 variables 生成）
#   ${level_css}   等级色标 .lvl-L1 … .lvl-LN
#   ${fallback_css} / ${fallback_border}  未知等级的兜底色
#   ${cyan_a10} / ${blue_a07}             主色的低透明度变体
# =============================================================================

variables:
  bg: "#05080f"
  panel: "rgba(11, 18, 30, 0.82)"
  panel_2: "rgba(9, 15, 25, 0.92)"
  line: "rgba(56, 189, 248, 0.16)"
  line_2: "rgba(56, 189, 248, 0.34)"
  cyan: "#22d3ee"
  blue: "#38bdf8"
  text: "#d6e4f2"
  dim: "#7d90a8"
  amber: "#fbbf24"
  red: "#f87171"

# 主色低透明度变体，写死在 CSS 里不好维护，放这里
tints:
  cyan_a10: "rgba(34, 211, 238, 0.10)"
  blue_a07: "rgba(56, 189, 248, 0.07)"

head_html: |
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

logo_svg: |
  <svg width="30" height="30" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="24" cy="24" r="21" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="1"/>
    <path d="M5 26 H13 L17 16 L22 33 L27 20 L31 26 H43" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="17" cy="16" r="1.8" fill="#38bdf8"/>
    <circle cx="27" cy="20" r="1.8" fill="#38bdf8"/>
    <path d="M5 38 H43" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="3 3"/>
  </svg>

css: |

  :root ${root_vars}

  body.body--dark {
    background: var(--sy-bg) !important;
    color: var(--sy-text);
    font-family: "Inter", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  /* 深色背景：网格 + 两团柔光 */
  .sy-bgfx {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(900px 500px at 82% -8%, ${cyan_a10}, transparent 65%),
      radial-gradient(760px 420px at 4% 102%, ${blue_a07}, transparent 60%),
      linear-gradient(rgba(56, 189, 248, 0.045) 1px, transparent 1px) 0 0 / 100% 34px,
      linear-gradient(90deg, rgba(56, 189, 248, 0.045) 1px, transparent 1px) 0 0 / 34px 100%;
  }
  .sy-bgfx::after {
    content: ""; position: absolute; inset: 0;
    background-image:
      radial-gradient(1.4px 1.4px at 12% 22%, rgba(214, 228, 242, .55), transparent),
      radial-gradient(1.2px 1.2px at 78% 12%, rgba(214, 228, 242, .35), transparent),
      radial-gradient(1.6px 1.6px at 62% 68%, rgba(214, 228, 242, .30), transparent),
      radial-gradient(1.2px 1.2px at 28% 82%, rgba(214, 228, 242, .35), transparent),
      radial-gradient(1.2px 1.2px at 90% 54%, rgba(214, 228, 242, .28), transparent);
    opacity: .8;
  }

  .sy-shell { position: relative; z-index: 1; }

  /* 顶栏 */
  .sy-header {
    display: flex; align-items: center; gap: 18px;
    padding: 10px 22px; margin: 0 0 14px 0;
    border-bottom: 1px solid var(--sy-line);
    background: linear-gradient(180deg, rgba(8, 14, 24, .96), rgba(8, 14, 24, .72));
    backdrop-filter: blur(6px);
  }
  .sy-logo { display: flex; align-items: center; gap: 12px; }
  .sy-logo svg { filter: drop-shadow(0 0 6px rgba(34, 211, 238, .55)); }
  .sy-brand { font-size: 15px; font-weight: 700; letter-spacing: 3px; color: #eaf6ff; }
  .sy-brand span { color: var(--sy-cyan); }
  .sy-sub { font-size: 11px; letter-spacing: 1.4px; color: var(--sy-dim); margin-top: 2px; }
  .sy-mod {
    font-size: 11px; letter-spacing: 2px; color: var(--sy-cyan);
    border: 1px solid var(--sy-line-2); border-radius: 3px; padding: 4px 10px;
    background: rgba(34, 211, 238, .07);
  }
  .sy-status { display: flex; align-items: center; gap: 8px; }

  .sy-chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; letter-spacing: .6px; color: #a9c3da;
    border: 1px solid var(--sy-line); border-radius: 3px; padding: 3px 9px;
    background: rgba(13, 22, 36, .7); white-space: nowrap;
  }
  .sy-chip b { color: var(--sy-text); font-weight: 600; }
  .sy-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--sy-cyan); box-shadow: 0 0 6px var(--sy-cyan); }
  .sy-dot.amber { background: var(--sy-amber); box-shadow: 0 0 6px var(--sy-amber); }
  .sy-dot.red { background: var(--sy-red); box-shadow: 0 0 6px var(--sy-red); }

  /* 侧边导航 */
  .sy-rail {
    width: 196px; flex: 0 0 196px; padding: 6px 0 0 0;
  }
  .sy-nav {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 14px; margin: 4px 6px; border-radius: 4px;
    color: #93a9c0; font-size: 13px; letter-spacing: .5px; cursor: pointer;
    border-left: 2px solid transparent; transition: all .16s ease;
  }
  .sy-nav:hover { background: rgba(56, 189, 248, .06); color: #d6e4f2; }
  .sy-nav.active {
    background: linear-gradient(90deg, rgba(34, 211, 238, .16), rgba(34, 211, 238, .02));
    border-left-color: var(--sy-cyan); color: #eaf6ff;
    box-shadow: inset 0 0 22px rgba(34, 211, 238, .08);
  }
  .sy-nav .idx { font-family: ui-monospace, monospace; font-size: 11px; color: #4a627a; }
  .sy-nav.active .idx { color: var(--sy-cyan); }
  .sy-rail-foot {
    margin-top: 20px; padding: 12px 14px; font-size: 10px; line-height: 1.7;
    color: #4d6379; border-top: 1px solid rgba(56, 189, 248, .10);
  }

  /* 卡片：角标 + 微光边框 */
  .sy-card {
    background: var(--sy-panel); border: 1px solid var(--sy-line);
    border-radius: 4px; padding: 14px 16px; position: relative;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .02);
  }
  .sy-card::before, .sy-card::after {
    content: ""; position: absolute; width: 9px; height: 9px; pointer-events: none;
    border-color: var(--sy-cyan); opacity: .65;
  }
  .sy-card::before { top: -1px; left: -1px; border-top: 1px solid; border-left: 1px solid; }
  .sy-card::after { bottom: -1px; right: -1px; border-bottom: 1px solid; border-right: 1px solid; }
  .sy-card-title {
    display: flex; align-items: center; gap: 8px; font-size: 13px; letter-spacing: 1.2px;
    color: #dceaf7; font-weight: 600;
  }
  .sy-card-title .bar { width: 3px; height: 13px; background: var(--sy-cyan); box-shadow: 0 0 8px var(--sy-cyan); }
  .sy-card-sub { font-size: 11px; color: var(--sy-dim); letter-spacing: .3px; }

  .sy-label { font-size: 10px; letter-spacing: 1.4px; color: #6f859c; text-transform: uppercase; }
  .sy-mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
  .sy-num { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 20px; color: #eaf6ff; letter-spacing: .5px; }
  .sy-hint { font-size: 11px; color: #6d8298; line-height: 1.6; }

  /* 算法卡片 */
  .algo-card {
    border: 1px solid var(--sy-line); border-radius: 4px; padding: 12px 14px;
    background: linear-gradient(160deg, rgba(14, 23, 38, .9), rgba(9, 15, 25, .8));
    transition: border-color .16s ease, transform .16s ease;
  }
  .algo-card:hover { border-color: var(--sy-line-2); transform: translateY(-1px); }
  .algo-id {
    font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--sy-cyan);
    border: 1px solid rgba(34, 211, 238, .35); border-radius: 3px; padding: 1px 6px;
  }
  .algo-name { font-size: 13px; color: #e3eefb; font-weight: 600; }
  .tag {
    font-size: 10px; letter-spacing: .5px; padding: 1px 6px; border-radius: 2px;
    border: 1px solid rgba(125, 144, 168, .35); color: #9db2c8;
  }
  .tag.cyan { color: var(--sy-cyan); border-color: rgba(34, 211, 238, .4); background: rgba(34, 211, 238, .07); }
  .tag.user { color: #c4b5fd; border-color: rgba(167, 139, 250, .45); background: rgba(167, 139, 250, .08); }
  .tag.warn { color: var(--sy-amber); border-color: rgba(251, 191, 36, .4); }

  /* 等级色标：由 config/app.yaml → levels 生成 */
  .lvl { font-size: 11px; padding: 1px 7px; border-radius: 2px; font-weight: 600; letter-spacing: .5px; }
  ${level_css}
  .lvl-blank { color: ${fallback_css}; border: 1px solid ${fallback_border}; }

  /* Quasar 覆盖：输入、表格、标签页 */
  .q-field--outlined .q-field__control { border-radius: 3px; background: rgba(7, 12, 21, .75); }
  .q-field--outlined .q-field__control:before { border-color: rgba(56, 189, 248, .22); }
  .q-field--outlined .q-field__control:hover:before { border-color: rgba(56, 189, 248, .4); }
  .q-field__label { color: #7d90a8 !important; font-size: 12px; letter-spacing: .4px; }
  .q-field__native, .q-field__input { color: #dbe9f7 !important; font-family: "JetBrains Mono", ui-monospace, monospace; }
  .q-menu, .q-dialog__inner > .q-card {
    background: #0a1220 !important; border: 1px solid var(--sy-line-2);
    color: var(--sy-text) !important;
  }
  .q-item { color: #c3d5e6; }
  .q-item.q-item--active, .q-item--dark.q-item--active { color: var(--sy-cyan); background: rgba(34, 211, 238, .08) !important; }

  .q-tabs { border-bottom: 1px solid var(--sy-line); }
  .q-tab { color: #8aa1b8 !important; letter-spacing: .8px; min-height: 40px; font-size: 12px; }
  .q-tab--active { color: var(--sy-cyan) !important; }
  .q-tab__indicator { background: var(--sy-cyan) !important; height: 2px !important; box-shadow: 0 0 8px var(--sy-cyan); }

  .q-table__container { background: transparent !important; }
  .q-table { background: transparent !important; color: #cfe0ef !important; }
  .q-table thead tr { background: rgba(12, 21, 34, .9) !important; }
  .q-table th { color: #7d90a8 !important; font-size: 11px; letter-spacing: .8px; font-weight: 500; border-color: rgba(56,189,248,.10) !important; }
  .q-table td { font-size: 12px; border-color: rgba(56, 189, 248, .07) !important; font-family: "JetBrains Mono", ui-monospace, monospace; }
  .q-table tbody tr:hover { background: rgba(34, 211, 238, .05) !important; }
  .q-table__bottom { color: #6d8298 !important; border-color: rgba(56,189,248,.1) !important; }

  .q-btn { letter-spacing: .6px; }
  .q-btn--outline:before { border-color: rgba(56, 189, 248, .45) !important; }
  .sy-btn-primary {
    background: linear-gradient(135deg, rgba(34, 211, 238, .95), rgba(56, 189, 248, .85)) !important;
    color: #04121c !important; font-weight: 700;
    box-shadow: 0 0 18px rgba(34, 211, 238, .35);
  }
  .sy-btn-ghost { color: #a9c3da !important; border: 1px solid rgba(56, 189, 248, .3) !important; }

  .q-expansion-item .q-item { color: #cfe0ef !important; }
  .q-expansion-item__content { background: rgba(6, 11, 19, .5); }
  .q-separator { background: rgba(56, 189, 248, .12) !important; }
  .q-notification { background: #0c1726 !important; border: 1px solid var(--sy-line-2); color: #dbe9f7 !important; }
  .q-textarea .q-field__native { font-family: "JetBrains Mono", monospace; font-size: 12px; line-height: 1.55; }
  .nicegui-content { padding: 0 !important; }
  .q-page { min-height: 0; }

  .sy-kpi {
    border: 1px solid var(--sy-line); border-radius: 3px; padding: 8px 12px;
    background: linear-gradient(160deg, rgba(13, 22, 36, .9), rgba(8, 13, 22, .8));
    min-width: 92px;
  }
  .sy-kpi .k { font-size: 10px; letter-spacing: 1.2px; color: #6f859c; }
  .sy-kpi .v { font-family: "JetBrains Mono", monospace; font-size: 19px; color: #eaf6ff; }
  .sy-kpi .v.red { color: #fca5a5; }
  .sy-kpi .v.amber { color: #fcd34d; }
  .sy-kpi .v.cyan { color: var(--sy-cyan); }

  .sy-split { display: flex; gap: 12px; align-items: stretch; }
  .sy-scroll { max-height: 520px; overflow-y: auto; }
  .sy-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
  .sy-scroll::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, .25); border-radius: 3px; }
  .sy-scroll::-webkit-scrollbar-track { background: transparent; }

  .sy-empty {
    border: 1px dashed rgba(56, 189, 248, .22); border-radius: 4px; padding: 34px;
    text-align: center; color: #5f7488; font-size: 12px; letter-spacing: .6px;
  }
  .sy-glow-line { height: 1px; background: linear-gradient(90deg, transparent, rgba(34,211,238,.55), transparent); }
